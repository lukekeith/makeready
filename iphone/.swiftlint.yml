# SwiftLint — audit enforcement layer (Phase 5.1, iphone-2026-06-10-plan.md)
#
# Philosophy: ONLY the audit's conventions, no stylistic noise. Every rule
# here gates a regression class the 2026-06 audit found. Existing violations
# are grandfathered in .swiftlint-baseline.json — rules gate NEW code only,
# so nothing here forces a risky mass-edit.
#
# Regenerate the baseline ONLY when consciously accepting a violation:
#   cd iphone && swiftlint lint --write-baseline .swiftlint-baseline.json

only_rules:
  - custom_rules
  - force_try
  - force_cast
  - force_unwrapping

included:
  - MakeReady
  - MakeReadyUI

excluded:
  - MakeReadyCaptureTests
  - MakeReady/Preview Content

force_try:
  severity: error
force_cast:
  severity: error
# Warning-only: pervasive in #Preview blocks, which SwiftLint can't scope.
force_unwrapping:
  severity: warning

custom_rules:
  no_print_or_nslog:
    name: "No print/NSLog in new code"
    regex: '(?<![\w.])(?:print|NSLog)\('
    message: "New logging goes through the Log wrappers (os.Logger — audit 5.2). Existing call sites are baselined; don't add more."
    severity: error

  raw_horizontal_scrollview:
    name: "Raw horizontal ScrollView in the UI 2.0 module"
    regex: 'ScrollView\(\.horizontal'
    included: '.*/MakeReadyUI/.*'
    excluded: '.*/MakeReadyUI/HorizontalScrolling\.swift'
    message: "Use HorizontalRail — a raw horizontal ScrollView traps vertical swipes while it coasts (MakeReadyUI/HorizontalScrolling.swift, horizontal-scroll-yield)."
    severity: error

  sideways_drag_gesture:
    name: "DragGesture in the UI 2.0 module"
    regex: '(?<!// pan-ok: [^\n]{0,200}\n[ \t]{0,40})DragGesture\('
    included: '.*/MakeReadyUI/.*'
    message: "A DragGesture holds the touch so the page cannot scroll. A sideways drag uses .horizontalPan (HorizontalScrolling.swift); any other drag gets a `// pan-ok: <why>` comment on the line above."
    severity: error

  color_hex_outside_tokens:
    name: "Inline Color(hex:) outside Colors.swift"
    regex: 'Color\(hex:'
    excluded: '.*Colors\.swift'
    message: "Use a color token instead of an inline hex (audit 5.3)."
    severity: error

  raw_font_size_outside_typography:
    name: "Raw .system(size:) outside Typography.swift"
    regex: '\.system\(size:'
    # MakeReadyUI/Tokens.swift is the UI 2.0 module's own token file — the
    # direct 2.0 counterpart of Typography.swift (docs/ui2/migration.md rule
    # 4: 2.0 tokens are generated into their own namespace, legacy
    # Typography.swift stays untouched). It's what this rule exists to
    # permit, not a violation of it — don't remove it from the exclusion.
    # Path-anchored, not just the basename: only THAT Tokens.swift is exempt.
    excluded: '.*(Typography\.swift|MakeReadyUI/Tokens\.swift)'
    message: "Use a Typography token instead of a raw size (audit 5.4)."
    severity: error

  async_after_choreography:
    name: "asyncAfter wall-clock wait"
    regex: 'asyncAfter\(deadline:'
    # ScrollLockCoordinator waits out UIKit's OWN asynchronous scroll settling,
    # which offers no completion callback — it is not animation choreography.
    # The machinery was carried verbatim out of ExegesisVerseView (decided
    # 2026-08-04, docs/features/highlighting/ 09 §C-c) with its device-tuned
    # delays intact; every call site funnels through one `dispatch(_:after:)`.
    excluded: '.*ScrollLockCoordinator\.swift'
    message: "No wall-clock waits for navigation/animation choreography — use withAnimation(_:){} completion:, dismiss(_:then:), or SlideStack onDismissComplete (audit 3.2 / review rule E1). Legitimate timers (e.g. toasts) get baselined consciously."
    severity: error

  nonstatic_formatter:
    name: "Formatter must be static"
    regex: '(?<!static )(?:let|var)\s+\w*[fF]ormatter\s*=\s*(?:Date|Number|ISO8601Date|ByteCount|DateComponents|RelativeDateTime|Measurement)Formatter\('
    excluded: '.*(?:Date\+Formatting|CalendarModels)\.swift'
    message: "Formatters are expensive to create — declare static and reuse (audit 5.1; see DateFormatters.swift). Inside a static-initializer closure, name the local `f` (the regex can't see closure context). Actions/Services keep deliberate once-per-OPERATION locals (see Date+Formatting.swift's thread note) — those are baselined, not new-code license."
    severity: error

  server_collection_in_view_state:
    name: "Server collection held in view @State"
    regex: '@State\s+(?:private\s+)?var\s+\w+\s*:\s*\[[A-Z]\w*\]\s*='
    included: '.*/MakeReady/(Pages|Components)/.*'
    message: "Server-derived collections live in AppState (an EntityStore, or an @Observable property like allProgramTags) — see docs/features/state-management/README.md § The rule. In-flight edit buffers and pure UI state are exempt: baseline them deliberately. Deliberately blunt — it cannot tell a server model from a UI struct, so a legitimate case becomes a reviewed baseline entry rather than a silent omission."
    severity: error

  lazy_container_in_overlay_content:
    name: "Lazy container in animated overlay file"
    regex: 'Lazy[VH](?:Stack|Grid)\('
    excluded: '.*(?:MainLibrary|MainHome|MainCalendar|StudyProgramHome|VideoLibraryPage|SelectVideoPage|MediaLibraryGrid|CardMediaFull|SkeletonCardMediaFull|ProgramHomePage|Kpi|CardActivityType|AddActivityMenu|HomeDashboardScreen|MembersHomeScreen|GroupsHomeScreen|StudyProgramsScreen|EnrollmentsHomeScreen)\.swift'   # HomeDashboardScreen: the ~190-day Activity rail (owner 2026-10-25); MembersHomeScreen: the org member directory, pinned search header (members-search-pinned); GroupsHomeScreen, StudyProgramsScreen, EnrollmentsHomeScreen: the same pinned header (owner 2026-10-28)
    message: "Lazy containers inside content that animates in pop to final position (Class 2 — SWIFTUI_TRANSITIONS.md § Lazy Containers). Use VStack / chunked HStack rows for small fixed content; if this is a long scroll list or appeared-gated content, baseline it consciously and add the file to this rule's excluded list."
    severity: error
