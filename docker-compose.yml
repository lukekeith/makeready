services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: makeready-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: makeready_dev
    ports:
      - "5434:5432"
    volumes:
      - makeready_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # S3-compatible image store for the agent walk (walk-image-storage). The walk server's
  # R2_ENDPOINT points here; the human's dev server keeps its R2 dev bucket. s3mock checks no
  # credentials, serves every object by plain URL and keeps nothing across a restart — the walk's
  # reset restarts it. (MinIO was the first pick; its images are no longer publicly pullable.)
  s3mock:
    image: adobe/s3mock:5.2.3
    container_name: makeready-s3mock
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: makeready-walk
    ports:
      - "9010:9090"

  # The local dev server's image store: a simulated bucket, so local uploads and fixture images
  # never reach production's R2 bucket. Unlike the walk's s3mock, it keeps its files on a volume.
  # Objects are served by plain URL on the Mac's network name, so the simulator, a phone on the
  # same Wi-Fi and the browser all load the same stored URLs.
  dev-images:
    image: adobe/s3mock:5.2.3
    container_name: makeready-dev-images
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: makeready-dev
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "9011:9090"
    volumes:
      - makeready_dev_images:/s3mockroot

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: makeready-server
    ports:
      - "3010:3010"
    volumes:
      - ./server/src:/app/src
      - ./server/prisma:/app/prisma
      - ./server/atlas:/app/atlas
      - ./server/fixtures:/app/fixtures
      - ./server/package.json:/app/package.json
      - /app/src/generated/prisma
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: development
      PORT: 3010
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/makeready_dev
      DIRECT_URL: postgresql://postgres:postgres@postgres:5432/makeready_dev
      CLIENT_URL: http://localhost:8000
      # `VERBOSE_LOGGING=true docker compose -p makeready up -d server` records every request in activity_logs.
      VERBOSE_LOGGING: ${VERBOSE_LOGGING:-false}
      # Images go to dev-images, never production's bucket (these override server/.env).
      R2_ENDPOINT: http://dev-images:9090
      R2_BUCKET_NAME: makeready-dev
      R2_PUBLIC_URL: http://${MAKEREADY_DEV_HOST:-Lukes-MacBook-Pro-534.local}:9011/makeready-dev
    depends_on:
      postgres:
        condition: service_healthy
      dev-images:
        condition: service_started

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: makeready-client
    ports:
      - "8000:8000"
      - "5174:5174"
    volumes:
      - ./client/app:/var/www/html/app
      - ./client/resources:/var/www/html/resources
      - ./client/routes:/var/www/html/routes
      - ./client/config:/var/www/html/config
    env_file:
      - ./client/.env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      API_URL: http://server:3010
      VITE_HOST: "0.0.0.0"
      VITE_PORT: "5174"
    depends_on:
      - server

volumes:
  makeready_postgres_data:
  makeready_dev_images:
